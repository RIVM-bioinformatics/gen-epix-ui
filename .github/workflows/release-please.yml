name: release-please
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases-created: ${{ steps.release.outputs.releases_created }}
      ui-client-common-release-created: ${{ steps.release.outputs['packages/ui-client-common--release_created'] }}
      ui-client-common-tag-name: ${{ steps.release.outputs['packages/ui-client-common--tag_name'] }}
      ui-core-release-created: ${{ steps.release.outputs['packages/ui-core--release_created'] }}
      ui-core-tag-name: ${{ steps.release.outputs['packages/ui-core--tag_name'] }}
      ui-core-components-release-created: ${{ steps.release.outputs['packages/ui-core-components--release_created'] }}
      ui-core-components-tag-name: ${{ steps.release.outputs['packages/ui-core-components--tag_name'] }}
      ui-client-casedb-release-created: ${{ steps.release.outputs['packages/ui-client-casedb--release_created'] }}
      ui-client-casedb-tag-name: ${{ steps.release.outputs['packages/ui-client-casedb--tag_name'] }}
      ui-client-omopdb-release-created: ${{ steps.release.outputs['packages/ui-client-omopdb--release_created'] }}
      ui-client-omopdb-tag-name: ${{ steps.release.outputs['packages/ui-client-omopdb--tag_name'] }}
      ui-client-seqdb-release-created: ${{ steps.release.outputs['packages/ui-client-seqdb--release_created'] }}
      ui-client-seqdb-tag-name: ${{ steps.release.outputs['packages/ui-client-seqdb--tag_name'] }}
      ui-phylogenetic-tree-release-created: ${{ steps.release.outputs['packages/ui-phylogenetic-tree--release_created'] }}
      ui-phylogenetic-tree-tag-name: ${{ steps.release.outputs['packages/ui-phylogenetic-tree--tag_name'] }}
      ui-core-form-release-created: ${{ steps.release.outputs['packages/ui-core-form--release_created'] }}
      ui-core-form-tag-name: ${{ steps.release.outputs['packages/ui-core-form--tag_name'] }}
      api-casedb-release-created: ${{ steps.release.outputs['packages/api-casedb--release_created'] }}
      api-casedb-tag-name: ${{ steps.release.outputs['packages/api-casedb--tag_name'] }}
      api-commondb-release-created: ${{ steps.release.outputs['packages/api-commondb--release_created'] }}
      api-commondb-tag-name: ${{ steps.release.outputs['packages/api-commondb--tag_name'] }}
      api-seqdb-release-created: ${{ steps.release.outputs['packages/api-seqdb--release_created'] }}
      api-seqdb-tag-name: ${{ steps.release.outputs['packages/api-seqdb--tag_name'] }}
      api-omopdb-release-created: ${{ steps.release.outputs['packages/api-omopdb--release_created'] }}
      api-omopdb-tag-name: ${{ steps.release.outputs['packages/api-omopdb--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  merge-main-into-development:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases-created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: development
          fetch-depth: 0

      - name: Merge main into development
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff origin/main -m "chore: merge main into development [skip ci]"
          git push origin development

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases-created == 'true' }}
    strategy:
      matrix:
        include:
          - package: ui-client-casedb
            path: packages/ui-client-casedb
            release-created: ui-client-casedb-release-created
            tag-name: ui-client-casedb-tag-name
          - package: ui-client-omopdb
            path: packages/ui-client-omopdb
            release-created: ui-client-omopdb-release-created
            tag-name: ui-client-omopdb-tag-name
          - package: ui-client-seqdb
            path: packages/ui-client-seqdb
            release-created: ui-client-seqdb-release-created
            tag-name: ui-client-seqdb-tag-name
          - package: ui-client-common
            path: packages/ui-client-common
            release-created: ui-client-common-release-created
            tag-name: ui-client-common-tag-name
          - package: ui-phylogenetic-tree
            path: packages/ui-phylogenetic-tree
            release-created: ui-phylogenetic-tree-release-created
            tag-name: ui-phylogenetic-tree-tag-name
          - package: ui-core
            path: packages/ui-core
            release-created: ui-core-release-created
            tag-name: ui-core-tag-name
          - package: ui-core-components
            path: packages/ui-core-components
            release-created: ui-core-components-release-created
            tag-name: ui-core-components-tag-name
          - package: ui-core-form
            path: packages/ui-core-form
            release-created: ui-core-form-release-created
            tag-name: ui-core-form-tag-name
          - package: api-casedb
            path: packages/api-casedb
            release-created: api-casedb-release-created
            tag-name: api-casedb-tag-name
          - package: api-commondb
            path: packages/api-commondb
            release-created: api-commondb-release-created
            tag-name: api-commondb-tag-name
          - package: api-seqdb
            path: packages/api-seqdb
            release-created: api-seqdb-release-created
            tag-name: api-seqdb-tag-name
          - package: api-omopdb
            path: packages/api-omopdb
            release-created: api-omopdb-release-created
            tag-name: api-omopdb-tag-name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24

      - name: Install dependencies
        if: ${{ needs.release-please.outputs[matrix.release-created] == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Create .npmrc
        if: ${{ needs.release-please.outputs[matrix.release-created] == 'true' }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build
        if: ${{ needs.release-please.outputs[matrix.release-created] == 'true' }}
        run: pnpm --filter @gen-epix/${{ matrix.package }} run build

      - name: Zip dist directory
        if: ${{ needs.release-please.outputs[matrix.release-created] == 'true' }}
        run: cd ${{ matrix.path }} && zip -r ../../gen-epix-${{ matrix.package }}.zip dist

      - name: Upload release artifact to GitHub
        if: ${{ needs.release-please.outputs[matrix.release-created] == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.release-please.outputs[matrix.tag-name] }} gen-epix-${{ matrix.package }}.zip --clobber

      - name: Publish to NPM
        if: ${{ needs.release-please.outputs[matrix.release-created] == 'true' }}
        run: pnpm --filter @gen-epix/${{ matrix.package }} publish --access=public --no-git-checks
