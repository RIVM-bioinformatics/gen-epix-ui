# Path to sources
# sonar.sources=
sonar.exclusions=packages/api-*/**/*
sonar.inclusions=packages/**/*

# Path to tests
sonar.tests=packages
sonar.test.exclusions=packages/api-*/**/*
sonar.test.inclusions=packages/**/*test.ts,packages/**/*test.tsx,packages/**/*integration.ts,packages/**/*integration.tsx

# Source encoding
sonar.sourceEncoding=UTF-8

# Exclusions for copy-paste detection
# sonar.cpd.exclusions=
